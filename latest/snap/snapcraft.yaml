name: just
title: just (by casey)
base: core24
version: 1.58.0
summary: "\U0001F916 Just a command runner."
description: "just is a handy way to save and run project-specific commands. \nCommands, called recipes, are stored in a file called justfile with syntax inspired by make.\n"
contact: luca.bello@canonical.com
license: Apache-2.0
donation:
  - https://github.com/sponsors/casey
  - https://ko-fi.com/lucabello
issues:
  - https://github.com/casey/just/issues
  - https://github.com/lucabello/just-snap/issues
source-code:
  - https://github.com/casey/just
website: https://just.systems
grade: stable
confinement: classic
platforms:
  amd64:
  arm64:
    build-on: ["amd64", "arm64"]
    build-for: ["arm64"]
  riscv64:
    build-on: ["amd64", "riscv64"]
    build-for: ["riscv64"]
  s390x:
    build-on: ["amd64", "s390x"]
    build-for: ["s390x"]
  ppc64el:
    build-on: ["amd64", "ppc64el"]
    build-for: ["ppc64el"]
parts:
  just:
    plugin: rust
    source: https://github.com/casey/just.git
    source-tag: $SNAPCRAFT_PROJECT_VERSION
    organize:
      just: bin/just
    build-environment:
      - to amd64:
          - CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      - to arm64:
          - CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          - CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
          - CC: aarch64-linux-gnu-gcc
      - to riscv64:
          - CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          - CARGO_BUILD_TARGET: riscv64gc-unknown-linux-gnu
          - CC: riscv64-linux-gnu-gcc
      - to s390x:
          - CARGO_TARGET_S390X_UNKNOWN_LINUX_GNU_LINKER: s390x-linux-gnu-gcc
          - CARGO_BUILD_TARGET: s390x-unknown-linux-gnu
          - CC: s390x-linux-gnu-gcc
      - to ppc64el:
          - CARGO_TARGET_POWERPC64LE_UNKNOWN_LINUX_GNU_LINKER: powerpc64le-linux-gnu-gcc
          - CARGO_BUILD_TARGET: powerpc64le-unknown-linux-gnu
          - CC: powerpc64le-linux-gnu-gcc
    build-packages:
      - to amd64:
          - mingw-w64
      - to arm64:
          - gcc-aarch64-linux-gnu
          - linux-libc-dev-arm64-cross
          - libc6-dev-arm64-cross
      - to riscv64:
          - gcc-riscv64-linux-gnu
          - linux-libc-dev-riscv64-cross
          - libc6-dev-riscv64-cross
      - to s390x:
          - gcc-s390x-linux-gnu
          - linux-libc-dev-s390x-cross
          - libc6-dev-s390x-cross
      - to ppc64el:
          - gcc-powerpc64le-linux-gnu
          - linux-libc-dev-ppc64el-cross
          - libc6-dev-ppc64el-cross
    build-attributes:
      - enable-patchelf
    override-build: |
      rustup default stable
      rustup target add $CARGO_BUILD_TARGET
      RUSTFLAGS="--codegen target-feature=+crt-static" cargo build --target $CARGO_BUILD_TARGET --release
      install -Dvm755 target/$CARGO_BUILD_TARGET/release/just "${CRAFT_PART_INSTALL}"
apps:
  just:
    command: bin/just
    environment:
      PATH: $SNAP/bin:$SNAP/usr/bin:$PATH
